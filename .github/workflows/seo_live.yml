name: TeknoSteps SEO Live

# Rinomina le dirette 24/7 dei 3 canali che YouTube ripubblica col titolo di
# default spagnolo ("Emision en directo de ..."). Idempotente: salta quelle gia'
# marcate con la bandierina rossa. Gira nel cloud -> indipendente dal PC.
# (La routine SEO locale continua a lanciare lo stesso script; questo workflow
#  copre i momenti in cui il PC e' spento.)

on:
  schedule:
    # ogni 6 ore (00:30 / 06:30 / 12:30 / 18:30 UTC), sfasato dal daily (05:00 UTC)
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: teknosteps-seo-live
  cancel-in-progress: false

jobs:
  seo-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dipendenze (solo API Google, leggere)
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Ripristino credenziali (secret cifrati)
        env:
          CS: ${{ secrets.CLIENT_SECRET_B64 }}
          CS2: ${{ secrets.CLIENT_SECRET_CH2_B64 }}
          CS3: ${{ secrets.CLIENT_SECRET_CH3_B64 }}
          T1: ${{ secrets.TOKEN_CH1_B64 }}
          T2: ${{ secrets.TOKEN_CH2_B64 }}
          T3: ${{ secrets.TOKEN_CH3_B64 }}
        run: |
          printf '%s' "$CS" | tr -d '[:space:]' | base64 -d > client_secret.json
          printf '%s' "$T1" | tr -d '[:space:]' | base64 -d > token.json
          printf '%s' "$T2" | tr -d '[:space:]' | base64 -d > token_ch2.json
          printf '%s' "$T3" | tr -d '[:space:]' | base64 -d > token_ch3.json
          # client_secret separati per canale (progetti Google dedicati): solo se il secret esiste
          if [ -n "$CS2" ]; then printf '%s' "$CS2" | tr -d '[:space:]' | base64 -d > client_secret_ch2.json; fi
          if [ -n "$CS3" ]; then printf '%s' "$CS3" | tr -d '[:space:]' | base64 -d > client_secret_ch3.json; fi
          for f in client_secret.json token.json token_ch2.json token_ch3.json; do
            python -c "import json,sys; json.load(open('$f')); print('ok $f')" || { echo "[X] $f non valido"; exit 1; }
          done

      - name: SEO dirette 24/7 (rinomina broadcast col default spagnolo)
        run: python _seo_live.py --fix
