name: TeknoSteps Daily

# AFFIDABILITA': GitHub a volte ritarda/salta i job a orario. Quindi proviamo a
# PIU' orari al mattino; un "gate" fa in modo che si pubblichi UNA sola volta al
# giorno (se un run di oggi e' gia' riuscito o e' in corso, gli altri saltano).
on:
  schedule:
    - cron: '0 5 * * *'    # 07:00 Italia (estate)
    - cron: '0 6 * * *'    # 08:00 Italia
    - cron: '0 7 * * *'    # 09:00 Italia
    - cron: '0 9 * * *'    # 11:00 Italia (ultima rete di sicurezza)
  workflow_dispatch:
    inputs:
      shorts:
        description: 'Short per canale'
        default: '5'
      no_upload:
        description: 'Solo creazione (no upload su YouTube)'
        type: boolean
        default: false
      only:
        description: 'Solo canali che contengono (es. CH1) - vuoto = tutti'
        default: ''
      force:
        description: 'Forza la pubblicazione anche se oggi e già uscita'
        type: boolean
        default: false

concurrency:
  group: teknosteps-daily
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  # Decide se pubblicare: il manuale pubblica sempre; a orario pubblica solo se
  # oggi (UTC) non c'e' gia' un run riuscito o in corso. Cosi' i 4 cron non fanno doppioni.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decidi
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Avvio manuale/forzato: pubblico."; exit 0
          fi
          # Conta SOLO chi ha davvero pubblicato (job "publish" eseguito), non i run
          # che hanno solo saltato. Altrimenti due run ravvicinati si bloccano a
          # vicenda (uno vede l'altro "in coda" e salta, l'altro vede il primo
          # "riuscito" e salta) e in quel giorno non esce niente (successo il 22/07).
          TODAY=$(date -u +%F)
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/runs?per_page=40" \
                  --jq "[.workflow_runs[]
                          | select(.id != ${{ github.run_id }})
                          | select(.created_at >= \"${TODAY}T00:00:00Z\")
                          | .id] | .[]")
          DONE=0
          for id in $IDS; do
            ST=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                   --jq '[.jobs[] | select(.name=="publish") | (.conclusion // .status)] | .[0] // "none"' 2>/dev/null || echo none)
            echo "  run $id -> publish=$ST"
            case "$ST" in success|in_progress|queued) DONE=1; break ;; esac
          done
          if [ "$DONE" = "1" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Oggi qualcuno ha gia' pubblicato: salto (niente doppioni)."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Oggi nessuno ha pubblicato: pubblico io."
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Dipendenze Python
        run: pip install -r requirements-cloud.txt

      - name: Scarico gli asset (font, video pavimento, clip Kling, visual)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download assets-v1 --repo "$GITHUB_REPOSITORY" -p pipeline_assets.tar.gz
          tar xzf pipeline_assets.tar.gz
          rm -f pipeline_assets.tar.gz
          echo "Asset estratti:"; ls -1 | head -30

      - name: Ripristino credenziali (secret cifrati)
        env:
          CS: ${{ secrets.CLIENT_SECRET_B64 }}
          CS2: ${{ secrets.CLIENT_SECRET_CH2_B64 }}
          CS3: ${{ secrets.CLIENT_SECRET_CH3_B64 }}
          T1: ${{ secrets.TOKEN_CH1_B64 }}
          T2: ${{ secrets.TOKEN_CH2_B64 }}
          T3: ${{ secrets.TOKEN_CH3_B64 }}
        run: |
          printf '%s' "$CS" | tr -d '[:space:]' | base64 -d > client_secret.json
          printf '%s' "$T1" | tr -d '[:space:]' | base64 -d > token.json
          printf '%s' "$T2" | tr -d '[:space:]' | base64 -d > token_ch2.json
          printf '%s' "$T3" | tr -d '[:space:]' | base64 -d > token_ch3.json
          # client_secret separati per canale (progetti Google dedicati): solo se il secret esiste
          if [ -n "$CS2" ]; then printf '%s' "$CS2" | tr -d '[:space:]' | base64 -d > client_secret_ch2.json; fi
          if [ -n "$CS3" ]; then printf '%s' "$CS3" | tr -d '[:space:]' | base64 -d > client_secret_ch3.json; fi
          for f in client_secret.json token.json token_ch2.json token_ch3.json; do
            python -c "import json,sys; json.load(open('$f')); print('ok $f')" || { echo "[X] $f non valido"; exit 1; }
          done

      - name: Pubblicazione giornaliera
        env:
          TS_SHORTS: ${{ github.event.inputs.shorts || '5' }}
          MPLBACKEND: Agg
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          echo "Eseguo: pubblica_giornaliero.py $ARGS  (short/canale=$TS_SHORTS)"
          python pubblica_giornaliero.py $ARGS

      - name: Log come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log_pipeline
          path: |
            log_pipeline.txt
            _short_hooks_log.json
          if-no-files-found: ignore
          retention-days: 14
